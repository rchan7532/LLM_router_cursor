# router.ifmphk.com — front door for the LiteLLM router + control service.
#
# Structure (nginx regex locations match in FILE ORDER, so the more specific
# /control block MUST come before the general token block):
#   /<token>/control/...-> control_service on 127.0.0.1:4010 (MCP server talks here)
#   /<token>/v1/...     -> LiteLLM proxy on 127.0.0.1:4000   (Cursor talks here)
#   /<aider>/v1/...     -> LiteLLM proxy, stamped X-Client-Type: aider
# The path token is a gate; LITELLM_MASTER_KEY still authenticates inside it
# (defense in depth).
#
# PATH TOKENS ARE SECRET AND ROTATED. They leaked via this public repo's
# history once already (see _rotate_tokens.sh). This template therefore
# carries __MAIN_PATH_TOKEN__ / __AIDER_PATH_TOKEN__ placeholders only —
# substitute from /root/.router-path-tokens on the VPS at deploy time.
# NEVER commit real token values here.
#
# Certbot manages the TLS lines below — don't hand-edit those.

server {
    listen 80;
    listen [::]:80;
    server_name router.ifmphk.com;

    # ACME HTTP-01 challenge path.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name router.ifmphk.com;

    client_max_body_size 20m;

    # Long-horizon agent calls can think for a while before streaming.
    proxy_read_timeout 600s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;

    # SSE/streaming: don't buffer, don't let proxies stall idle streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";

    # MUST precede the general token block: first matching regex wins.
    # Dashboard: static HTML served by nginx directly.
    location = /__MAIN_PATH_TOKEN__/control/dashboard {
        alias /opt/llm-router/deploy/dashboard.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    # /<main>/control/health -> /health upstream (handle_path equivalent)
    location ~ ^/__MAIN_PATH_TOKEN__/control(?<control_path>/.*)$ {
        proxy_pass http://127.0.0.1:4010$control_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /<aider>/v1/chat/completions -> /v1/chat/completions upstream
    # aider entry path: stamps the harness so router receipts attribute
    # spend by route, not User-Agent. Keep secret like the main token.
    location ~ ^/__AIDER_PATH_TOKEN__(?<upstream_path>/.*)$ {
        proxy_set_header X-Client-Type aider;
        proxy_pass http://127.0.0.1:4000$upstream_path$is_args$args;
    }

    # /<main>/v1/chat/completions -> /v1/chat/completions upstream
    location ~ ^/__MAIN_PATH_TOKEN__(?<upstream_path>/.*)$ {
        proxy_pass http://127.0.0.1:4000$upstream_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Anything else on this host: quiet 404, no info leak.
    location / { return 404; }

    ssl_certificate /etc/letsencrypt/live/router.ifmphk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/router.ifmphk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
